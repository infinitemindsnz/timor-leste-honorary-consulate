# Governed section copy for the Honorary Consulate website.
#
# One record per section of src/content/sections/**, keyed by the section's collection id with
# "/" replaced by "-" (opportunity/01-asean -> opportunity-01-asean). The markdown file keeps only
# page, order, pattern, surface and its prose body; every eyebrow, title, lede, timeline entry,
# statistic, service card and the consul profile renders from here.
#
# Validated at build time by src/data/schema.ts (strict: an unknown key fails the build).

consular-services-01-services:
  eyebrow: "SERVISU / Consular Services"
  title: "A first point of contact"
  lede: "Support for Timorese nationals, and a bridge for cultural and commercial relationships."
  services:
  - icon: "heart-handshake"
    title: "Assistance for Timorese nationals"
    text: "Support, guidance, referrals and community connection for Timorese citizens living in Auckland and the North Island."
  - icon: "briefcase"
    title: "Investment facilitation"
    text: "Introductions and context for New Zealand-based investors exploring opportunities and relationships in Timor-Leste."
  - icon: "megaphone"
    title: "Promotion of Timor-Leste"
    text: "Raising awareness of Timor-Leste’s culture, tourism and economic potential through community and diplomatic engagement."
  - icon: "handshake"
    title: "Business and trade introductions"
    text: "Connecting New Zealand businesses with counterparts across agriculture, hospitality, education, infrastructure and digital sectors."
